services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cliproxyapi
    environment:
      DEPLOY: ${DEPLOY:-}
      # 用环境变量直接启用 management 鉴权
      MANAGEMENT_PASSWORD: ${MGMT_KEY:?MGMT_KEY is required}
      TZ: Asia/Shanghai
    ports:
      - "8317:8317"
      - "8185:8085"
      - "1355:1455"
      # - "53545:54545"
      # - "53121:51121"
      # - "13451:11451"
    networks:
      - wionch
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./data:/data
    restart: always

  cpa-manager:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    ports:
      - "18317:18317"
    networks:
      - wionch
    volumes:
      - ./cpa-manager-data:/data
    environment:
      # CPA 地址：同一个 compose 网络内，直接用服务名访问
      CPA_UPSTREAM_URL: http://cliproxyapi:8317

      # 使用与你的 CLIProxyAPI 相同的 Management Key（用于连接 CPA 面板）
      CPA_MANAGEMENT_KEY: ${MGMT_KEY:?MGMT_KEY is required}

      # Manager Server Admin Key（用于登录 Plus 管理界面）
      CPA_MANAGER_ADMIN_KEY: ${CPAMP_ADMIN_KEY:?CPAMP_ADMIN_KEY is required}

      # 推荐保持 auto，v6.10.8+ 会优先走 HTTP usage queue
      USAGE_COLLECTOR_MODE: auto

      # 可选：监听地址，默认就是 0.0.0.0:18317
      HTTP_ADDR: 0.0.0.0:18317
      TZ: Asia/Shanghai

networks:
  wionch:
    external: true
