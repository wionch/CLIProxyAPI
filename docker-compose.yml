services:
  cli-proxy-api:
    # 使用本地构建（包含 HF Space keepalive 定时任务等定制）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cliproxyapi
    environment:
      DEPLOY: ${DEPLOY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      SPACE_ID: ${SPACE_ID:-wionch/AIStudioBuildWS}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "34545:54545"
      - "31121:51121"
      - "11451:11451"
    networks:
      - 1panel-network
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./plugins:/CLIProxyAPI/plugins
      - ./data:/data
    restart: always

networks:
  1panel-network:
    external: true
